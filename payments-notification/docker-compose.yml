services:

  kafka-broker:
    image: apache/kafka:4.0.0
    container_name: kafka_broker_payments_notification
    ports:
      - "9092:9092"
    environment:
      KAFKA_MODE: KRaft
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - kafka-net-payments-notification
    volumes: 
      - kafka-data-payments-notification:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka_ui_payments_notification
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-payments-notification
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:29092
      KAFKA_CLUSTERS_0_KRAFT: "true"
    depends_on:
      - kafka-broker
    networks:
      - kafka-net-payments-notification

  postgres:
    image: postgres:latest
    container_name: postgres_payments_notification
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD} 
      POSTGRES_DB: postgres_db_payments_notification
    volumes:
      - postgres-data-payments-notification:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - kafka-net-payments-notification

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_payments_notification
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${EMAIL_USER}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5051:80"
    volumes:
      - pgadmin-data-payments-notification:/var/lib/pgadmin
    networks:
      - kafka-net-payments-notification

networks:
  kafka-net-payments-notification:
    driver: bridge

volumes:
  postgres-data-payments-notification:
  pgadmin-data-payments-notification:
  kafka-data-payments-notification: